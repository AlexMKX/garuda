- name: Apply Terraform-managed Ansible workload
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Assert workload_lifecycle is a strict provision/destroy value
      ansible.builtin.assert:
        that:
          - workload_lifecycle is defined
          - workload_lifecycle in ['provision', 'destroy']
        fail_msg: >-
          workload_lifecycle must be set to 'provision' or 'destroy' by the caller
          (modules/linux_apply/files/run_linux_apply.sh). Got:
          {{ workload_lifecycle }}.

    - name: Decode Terraform-rendered workload payload
      ansible.builtin.set_fact:
        workload_payload_vars: "{{ workload_payload_b64 | b64decode | from_json }}"

    - name: Validate Terraform payload shape for role dispatch
      ansible.builtin.assert:
        that:
          - workload_payload_vars is mapping
        fail_msg: workload_payload_b64 must decode to a mapping

    - name: Publish Terraform-rendered workload payload as top-level vars
      ansible.builtin.set_fact:
        "{{ item.key }}": "{{ item.value }}"
      loop: "{{ workload_payload_vars | dict2items }}"

    - name: Load target role linux_apply contract
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../../roles/{{ workload_kind }}/meta/linux_apply.yml"
        name: _role_meta

    - name: Assert role is declared linux_apply-compatible
      ansible.builtin.assert:
        that:
          - _role_meta.terraform.linux_apply.compatible is true
        fail_msg: >-
          Role '{{ workload_kind }}' is not declared linux_apply-compatible.
          Add 'terraform.linux_apply.compatible: true' to
          roles/{{ workload_kind }}/meta/linux_apply.yml.
          See docs/superpowers/specs/2026-04-21-linux-apply-role-contract-design.md.

    - name: Dispatch to workload role lifecycle entrypoint
      ansible.builtin.include_role:
        name: "{{ workload_kind }}"
        tasks_from: "{{ workload_lifecycle }}"
