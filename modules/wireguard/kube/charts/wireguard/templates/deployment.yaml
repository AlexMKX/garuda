apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.name | quote }}
  namespace: {{ .Values.namespace | quote }}
  labels:
    {{- include "wireguard.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "wireguard.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wireguard.labels" . | nindent 8 }}
      annotations:
        k8s.v1.cni.cncf.io/networks: {{ include "wireguard.networks" . | quote }}
    spec:
      restartPolicy: Always
      # Match the existing docker-compose stack's sysctls byte-for-byte.
      # All three are flagged "unsafe" by upstream kubelet and must be
      # allow-listed at k3s install time via
      # `--kubelet-arg=allowed-unsafe-sysctls=net.ipv4.ip_forward,net.ipv4.conf.all.src_valid_mark,net.ipv4.conf.all.rp_filter`.
      # See examples/mini-site/infra/gcp.tf for the operator-side wiring.
      securityContext:
        sysctls:
          - name: net.ipv4.ip_forward
            value: "1"
          - name: net.ipv4.conf.all.src_valid_mark
            value: "1"
          - name: net.ipv4.conf.all.rp_filter
            value: "2"
      containers:
        - name: wg
          # Container entrypoint is owned by the image
          # (ghcr.io/alexmkx/garuda-wireguard). The image reads env vars
          # below and brings up the WireGuard interface. Variable names
          # match roles/wireguard/files/wireguard/entrypoint.sh so the
          # image contract is identical to the Compose stack.
          image: {{ .Values.images.wireguard | quote }}
          imagePullPolicy: IfNotPresent
          envFrom:
            # The secret carries WG_PRIVATE_KEY, WG_PEER_PUBLIC_KEY and
            # the optional WG_PEER_PRESHARED_KEY.
            - secretRef:
                name: wg-{{ .Values.name }}-keys
          env:
            - name: WG_INTERFACE
              value: {{ .Values.config.kernel_ifname | quote }}
            - name: WG_ADDRESS
              value: {{ .Values.config.address | quote }}
            - name: WG_TABLE
              value: {{ .Values.table | quote }}
            - name: WG_PEER_ENDPOINT
              # Image entrypoint feeds WG_PEER_ENDPOINT verbatim into
              # the WireGuard config's `Endpoint = <host>:<port>` line.
              # The Compose stack (roles/wireguard/templates/wireguard.env.j2)
              # joins host and listen_port the same way.
              value: {{ printf "%s:%d" .Values.peer.endpoint_host (int .Values.peer.endpoint_listen_port) | quote }}
            - name: WG_PEER_ALLOWED_IPS
              value: {{ join "," .Values.allowed_nets | quote }}
            - name: WG_PEER_PERSISTENT_KEEPALIVE
              value: {{ .Values.persistent_keepalive | quote }}
            {{- with .Values.config.listen_port }}
            - name: WG_LISTEN_PORT
              value: {{ . | quote }}
            {{- end }}
            # WG_NIC_ATTACH advertises to roles/wireguard/postup.sh which
            # secondary interfaces are attached. The Compose stack maps
            # this to docker bridge networks; the k3s deployment maps it
            # to Multus NetworkAttachmentDefinitions via the pod
            # annotation `k8s.v1.cni.cncf.io/networks`. postup.sh treats
            # `border` membership as the trigger for installing the NAT
            # postrouting rule and the via_tunnel RPDB.
            - name: WG_NIC_ATTACH
              value: {{ .Values.nic_attach | toJson | quote }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
        {{- if .Values.ospf }}
        - name: frr-sidecar
          # Entrypoint owned by ghcr.io/alexmkx/garuda-frr-sidecar. The
          # image reads FRR_CONF_B64 / DAEMONS_B64 / VTYSH_CONF_B64 env
          # vars and writes /etc/frr/{frr.conf,daemons,vtysh.conf}
          # before starting zebra and ospfd. Same contract as the FRR
          # sidecars rendered by roles/backbone_network's
          # ospf_injector. BACKBONE_IP is the address allocated by
          # Multus on the backbone NAD; the sidecar consumes it for
          # transit-watcher routing decisions.
          image: {{ .Values.images.frr | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: FRR_CONF_B64
              value: {{ include "wireguard.frrConf" . | b64enc | quote }}
            - name: DAEMONS_B64
              value: {{ "ospfd=yes\nzebra=yes\n" | b64enc | quote }}
            - name: VTYSH_CONF_B64
              value: {{ "service integrated-vtysh-config\n" | b64enc | quote }}
            - name: BACKBONE_IP
              valueFrom:
                fieldRef:
                  # Pod IP on the primary cluster network. Backbone IP
                   # (Multus-assigned secondary interface) is not
                  # exposed via downward API — the sidecar discovers it
                  # at runtime from the interface itself.
                  fieldPath: status.podIP
          securityContext:
            capabilities:
              # FRR daemons (mgmtd, zebra, ospfd) call cap_set_proc on
              # boot and demand NET_ADMIN, NET_RAW and SYS_ADMIN. The
              # Compose-rendered sidecar (see
              # roles/backbone_network/files/ospf_injector/frr_injector/consumer.py)
              # uses the same capability set. Without SYS_ADMIN the
              # daemons abort with `privs_init: initial cap_set_proc
              # failed: Operation not permitted` and ospfd never starts.
              add: ["NET_ADMIN", "NET_RAW", "SYS_ADMIN"]
        {{- end }}
