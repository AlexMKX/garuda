---
argument_specs:
  provision:
    short_description: Apply WireGuard tunnel runtime config on a Linux host.
    options:
      wireguard_tunnel_name:
        type: str
        required: false
        description: Tunnel directory name; defaults to wireguard_interface_name when null.
      wireguard_interface_name:
        type: str
        required: true
      wireguard_address:
        type: str
        required: true
      wireguard_private_key:
        type: str
        required: true
        no_log: true
      wireguard_table:
        type: raw
        required: true
      wireguard_listen_port:
        type: int
        required: false
      wireguard_public_endpoint:
        type: str
        required: false
      wireguard_peer_public_key:
        type: str
        required: true
      wireguard_peer_address:
        type: str
        required: true
        description: Raw peer tunnel address (CIDR). The role derives /32 AllowedIPs internally.
      wireguard_peer_endpoint_host:
        type: str
        required: false
      wireguard_peer_listen_port:
        type: int
        required: false
      wireguard_peer_preshared_key:
        type: str
        required: false
        no_log: true
      wireguard_peer_persistent_keepalive:
        type: int
        required: false
      wireguard_allowed_nets:
        type: list
        elements: str
        required: false
        default: []
      wireguard_post_up:
        type: str
        required: false
      wireguard_pre_down:
        type: str
        required: false
      wireguard_labels:
        type: dict
        required: false
        default: {}
      wireguard_nic_attach:
        type: list
        elements: str
        required: false
        default: []
      wireguard_mesh_root:
        type: str
        required: false
        default: /opt/garuda/wg_tunnels
      wireguard_image:
        type: str
        required: true
      wireguard_ops_root:
        type: str
        required: false
        default: /opt/garuda/ops
  destroy:
    short_description: Remove a WireGuard tunnel from a Linux host.
    options:
      wireguard_tunnel_name:
        type: str
        required: false
      wireguard_interface_name:
        type: str
        required: true
      wireguard_mesh_root:
        type: str
        required: false
        default: /opt/garuda/wg_tunnels
      wireguard_ops_root:
        type: str
        required: false
        default: /opt/garuda/ops
