---
# Purpose: Remove WireGuard tunnel artifacts from a Linux host.
# Entry points: Invoked by modules/linux_apply dispatcher via tasks_from=destroy.
# Inputs: wireguard_tunnel_name, wireguard_mesh_root, wireguard_ops_root.
# Side effects: Stops compose stack, removes tunnel directory and FRR config,
#               reloads FRR if running.

- name: Normalize tunnel name for filesystem paths
  ansible.builtin.set_fact:
    wireguard_tunnel_name: "{{ wireguard_tunnel_name | default(wireguard_interface_name) }}"
  when:
    - wireguard_tunnel_name is not defined
    - wireguard_interface_name is defined

- name: Validate destroy-mode required variables
  ansible.builtin.assert:
    that:
      - wireguard_tunnel_name is defined
    quiet: true
    fail_msg: |
      Wireguard destroy requires:
      - wireguard_tunnel_name (or wireguard_interface_name fallback)

- name: Set tunnel directory path
  ansible.builtin.set_fact:
    _tunnel_dir: "{{ wireguard_mesh_root | default('/opt/garuda/wg_tunnels') }}/{{ wireguard_tunnel_name }}"
    _ops_dir: "{{ wireguard_ops_root | default('/opt/garuda/ops') }}"

- name: Check if tunnel directory exists
  ansible.builtin.stat:
    path: "{{ _tunnel_dir }}"
  register: _tunnel_stat

- name: Stop and remove docker compose
  when: _tunnel_stat.stat.exists
  block:
    - name: Check for docker-compose.yml
      ansible.builtin.stat:
        path: "{{ _tunnel_dir }}/docker-compose.yml"
      register: _compose_stat

    - name: Stop docker compose
      community.docker.docker_compose_v2:
        project_src: "{{ _tunnel_dir }}"
        state: absent
        remove_orphans: true
      when: _compose_stat.stat.exists
      ignore_errors: true

- name: Remove tunnel directory
  ansible.builtin.file:
    path: "{{ _tunnel_dir }}"
    state: absent

- name: Remove FRR config for tunnel
  ansible.builtin.file:
    path: "{{ _ops_dir }}/frr/conf.d/{{ wireguard_tunnel_name }}.conf"
    state: absent
  ignore_errors: true

- name: Reload FRR if running
  community.docker.docker_container_exec:
    container: frr
    command: 'vtysh -c "configure terminal" -c "end" -c "write memory"'
  changed_when: false
  failed_when: false
