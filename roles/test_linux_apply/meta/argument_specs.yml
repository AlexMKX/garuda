---
argument_specs:
  provision:
    short_description: Emit fixture debug output and write result envelope.
    options:
      greeting:
        type: str
        required: false
        default: world
        description: Greeting word used in the debug message.
      workload_kind:
        type: str
        required: true
        description: Published by the dispatcher.
      workload_result_path:
        type: str
        required: false
        description: Absolute path where result envelope is written.
  destroy:
    short_description: No-op destroy entrypoint (fixture has no state).
    options: {}
