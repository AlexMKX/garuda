# Purpose: Provision prerequisites, deploy Firezone, then configure OIDC providers.
# Entry points: Manual test run with a caller-supplied inventory defining host group `testing`.
# Inputs: ansible_facts memory data and vars from ../vars.yml plus roles/firezone/testing/vars.yml.
# Outputs: Firezone deployed and OIDC providers configured on testing host.
# Side effects: Installs packages/roles, deploys Firezone stack, and applies OIDC config.
# Tags: inherited from caller.

# Play 1: Install prerequisites and deploy Firezone (required before firezone_oidc).
- hosts: testing
  tasks:
    - set_fact:
        mem_available: "{{ (ansible_facts.memory_mb.real.free + ansible_facts.memory_mb.swap.free | default(0)) }}"
    - include_role:
        name: geerlingguy.swap
      vars:
        swap_file_size_mb: '{{ ansible_facts.memory_mb.swap.free | default(0) + 1024 }}'
      when: mem_available|int < 768
    - include_role:
        name: geerlingguy.docker
      vars:
        docker_edition: 'ce'
        docker_install_compose: false
        docker_install_compose_plugin: false

- name: Deploy Firezone
  hosts: testing
  roles:
    - "{{ playbook_dir }}/../../../firezone"
  vars_files:
    - ../../../firezone/testing/vars.yml

# Play 2: Configure OIDC providers (firezone_oidc must run after firezone).
- name: Configure Firezone OIDC providers
  hosts: testing
  roles:
    - "{{ playbook_dir }}/../../"
  vars_files:
    - ../vars.yml
