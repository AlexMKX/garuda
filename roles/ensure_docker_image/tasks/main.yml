---
# Entry point for ensure_docker_image.
# 1. Validate inputs (fail-fast).
# 2. Dispatch to pull.yml or build.yml based on ensure_docker_image_source.
# 3. Set the shared delivered-image facts that are part of the role's
#    public output contract.

- name: Validate ensure_docker_image inputs
  ansible.builtin.include_tasks: validate.yml

- name: Pull image from remote registry
  ansible.builtin.include_tasks: pull.yml
  when: ensure_docker_image_source == 'pull'

- name: Build image on controller and deliver to target
  ansible.builtin.include_tasks: build.yml
  when: ensure_docker_image_source == 'build'

- name: Set delivered image reference fact
  ansible.builtin.set_fact:
    ensure_docker_image_delivered_manifest_digest: "{{ _ensure_docker_image_effective_target_manifest_digest }}"
    ensure_docker_image_delivered_image_ref: "{{ ensure_docker_image_name }}@{{ _ensure_docker_image_effective_target_manifest_digest }}"
