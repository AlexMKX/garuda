[project]
name = "frr-injector"
version = "0.2.0"
description = "Sidecar operator runtime with FRR consumer"
requires-python = ">=3.12"
dependencies = [
    "docker>=7.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "flask>=3.0",
    "waitress>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1",
    "black>=25.1",
    "pylint>=4.0",
    "ciscoconfparse2>=0.9",
]

[tool.setuptools.packages.find]
include = ["frr_injector*", "sidecar_operator*", "network_manager*"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pylint.main]
py-version = "3.12"

[tool.pylint.format]
max-line-length = 100

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
