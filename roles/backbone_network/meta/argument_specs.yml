---
argument_specs:
  provision:
    short_description: Deploy OSPF injector + FRR sidecar compose stack.
    options:
      backbone_dir:
        type: str
        required: true
        description: Absolute path on target host for the compose project.
      backbone_subnet:
        type: str
        required: true
        description: CIDR subnet for the backbone bridge network.
      border_subnet:
        type: str
        required: true
        description: CIDR subnet for the border bridge network.
  destroy:
    short_description: Remove backbone compose stack and directory.
    options:
      backbone_dir:
        type: str
        required: true
