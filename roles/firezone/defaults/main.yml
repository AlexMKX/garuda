---
# Purpose: Define default variables for Firezone deployment and bootstrap behavior.
# Entry points: Loaded automatically by roles/firezone.
# Inputs: Optional fz_config map overrides from inventory/play vars.
# Outputs: Derived fz_* defaults for compose and networking settings.
# Side effects: None; variable defaults only.
# Tags: n/a.

fz_config: {}
## Firezone admin email
fz_client_subnet: "{{fz_config['fz_client_subnet'] | default ('10.11.0.0/24')}}"
fz_admin: "{{fz_config['fz_admin'] | default ('fz-admin@localhost')}}"
fz_admin_password: "{{fz_config['fz_admin_password'] | default (lookup('community.general.random_string', base64=true, length=12))  }}"
fz_wireguard_port: "{{fz_config['fz_wireguard_port'] | default ('51620')}}"
fz_firezone_dir: /opt/garuda/firezone
fz_firezone_https: "{{fz_config['fz_firezone_https'] | default (true)}}"
fz_server_url: "{{fz_config['fz_server_url'] | default ('https://'+ansible_host)}}"
fz_mgmt_subnet: "{{fz_config['fz_mgmt_subnet'] | default ()}}"
fz_firezone_image: "{{fz_config['fz_firezone_image'] | default ('local/firezone:0.7.30-nftedgefix')}}"

# Backbone / policy routing
fz_nic_attach: "{{ fz_config['fz_nic_attach'] | default(['backbone']) }}"

# Firezone built-in egress masquerade.
#
# DEFAULT IS FALSE.
#
# When `fz_masquerade=false`, the wg-firezone client subnet (10.0.24.0/24 by
# default) is preserved end-to-end across backbone, wg-tunnels and border, so
# downstream services (ipt_server pinning portal, OSPF transit, conntrack
# observability) see the real client tunnel IP rather than a backbone-side
# proxy. This requires the rest of the Garuda stack to handle SNAT at the
# border (and only at the border), which is how the role is deployed in
# Garuda topologies.
#
# !!! IMPORTANT — STAND-ALONE / NON-GARUDA OPERATORS !!!
# If you run this role outside the Garuda stack (no border bridge with
# masquerade, no upstream NAT chain), set `fz_masquerade=true` so firezone
# falls back to its built-in upstream masquerade on every non-wg interface.
# Without it, client traffic will leave the host with a non-routable
# 10.0.24.0/24 source and be silently dropped by the upstream router.
fz_masquerade: "{{ fz_config['fz_masquerade'] | default(false) }}"

firezone_labels: {}
