---
# Purpose: Default variables for firezone role.
# Entry points: Loaded automatically by roles/firezone.
# Inputs: Flat top-level vars from linux_apply payload.
# Outputs: None; variable defaults only.
# Side effects: None.
# Tags: n/a.

fz_client_subnet: "10.11.0.0/24"
fz_admin: "fz-admin@localhost"
fz_admin_password: "{{ lookup('community.general.random_string', base64=true, length=12) }}"
fz_wireguard_port: "51620"
fz_firezone_https: true
fz_server_url: "https://{{ ansible_host }}"
fz_mgmt_subnet: null
fz_nic_attach:
  - backbone
fz_masquerade: false

# Firezone built-in egress masquerade.
#
# DEFAULT IS FALSE.
#
# When `fz_masquerade=false`, the wg-firezone client subnet (10.0.24.0/24 by
# default) is preserved end-to-end across backbone, wg-tunnels and border, so
# downstream services (ipt_server pinning portal, OSPF transit, conntrack
# observability) see the real client tunnel IP rather than a backbone-side
# proxy. This requires the rest of the Garuda stack to handle SNAT at the
# border (and only at the border), which is how the role is deployed in
# Garuda topologies.
#
# !!! IMPORTANT — STAND-ALONE / NON-GARUDA OPERATORS !!!
# If you run this role outside the Garuda stack (no border bridge with
# masquerade, no upstream NAT chain), set `fz_masquerade=true` so firezone
# falls back to its built-in upstream masquerade on every non-wg interface.
# Without it, client traffic will leave the host with a non-routable
# 10.0.24.0/24 source and be silently dropped by the upstream router.

firezone_labels: {}
