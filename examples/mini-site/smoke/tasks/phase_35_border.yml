---
# Phase 3.5: border/backbone network checks. Hub remains docker-compose;
# edges run k3s with Multus bridge NetworkAttachmentDefinitions.
- name: "§3.5 — inspect hub border_network docker network"
  community.docker.docker_network_info:
    name: border_network
  become: true
  register: _border_net
  when: z2g_role == 'hub'

- name: "§3.5 — assert hub border_network subnet is {{ z2g_border_subnet }}"
  ansible.builtin.assert:
    that: z2g_border_subnet in (_border_net.network.IPAM.Config | map(attribute='Subnet') | list)
    fail_msg: "border_network must exist with subnet {{ z2g_border_subnet }} on {{ inventory_hostname }}"
  when: z2g_role == 'hub'

- name: "§3.5 — read ipt_server border interface addresses on hub"
  community.docker.docker_container_exec:
    container: ipt_server-garuda_ipt-1
    argv: [ip, -o, addr, show, border]
  become: true
  register: _ipt_border
  changed_when: false
  when: z2g_role == 'hub'

- name: "§3.5 — assert ipt_server border interface has an address in {{ z2g_border_subnet }} on hub"
  ansible.builtin.assert:
    that: >-
      _ipt_border.stdout_lines
        | map('regex_findall', '\\binet (\\S+)')
        | flatten
        | map('ansible.utils.ipaddr', z2g_border_subnet)
        | select
        | list | length > 0
    fail_msg: "border iface in ipt_server must have address in {{ z2g_border_subnet }}"
  when: z2g_role == 'hub'

- name: "§3.5k — assert edge NetworkAttachmentDefinitions exist"
  ansible.builtin.command:
    cmd: >
      kubectl --kubeconfig /etc/rancher/k3s/k3s.yaml
        -n garuda get network-attachment-definitions.k8s.cni.cncf.io
        backbone border
  become: true
  changed_when: false
  register: _edge_nads
  when: z2g_role in ['pt', 'de']

- name: "§3.5k — assert edge host bridges exist"
  ansible.builtin.command:
    cmd: "ip link show {{ item }}"
  become: true
  changed_when: false
  loop: [backbone, border]
  loop_control:
    label: "{{ item }}"
  register: _edge_bridges
  when: z2g_role in ['pt', 'de']

- name: "§3.5k — read edge bridge membership"
  ansible.builtin.command:
    cmd: bridge link show
  become: true
  changed_when: false
  register: _edge_bridge_links
  when: z2g_role in ['pt', 'de']

- name: "§3.5k — assert edge bridges have pod veth members"
  ansible.builtin.assert:
    that:
      - _edge_bridge_links.stdout is search('master backbone')
      - _edge_bridge_links.stdout is search('master border')
    fail_msg: |
      edge host bridges backbone/border must have pod veth members on {{ inventory_hostname }}.
      bridge link output:
      {{ _edge_bridge_links.stdout }}
  when: z2g_role in ['pt', 'de']
