name: Publish container images to ghcr

# Builds and pushes the five garuda workload images to
# ghcr.io/alexmkx/garuda-* on default-branch pushes that touch any
# image build context, and on manual dispatch.
#
# Tags:
#   :latest       — only on default-branch builds
#   :sha-<short>  — always, gives a stable handle for any commit
#
# Failures in one matrix cell do not block other cells (fail-fast: false).
# Re-run the failed job manually if one image fails to publish.

on:
  push:
    branches: [main]
    paths:
      - "roles/ipt_server/files/ipt-server/**"
      - "roles/ipt_server/files/powerdns/**"
      - "roles/wireguard/files/wireguard/**"
      - "roles/backbone_network/files/ospf_injector/**"
      - "roles/backbone_network/files/frr_sidecar/**"
      # Self-reference: at runtime this workflow lives in the PUBLIC repo
      # at .github/workflows/publish-images.yml. The source-of-truth in
      # private garuda-internal lives at .publish/public-workflows/.
      - ".github/workflows/publish-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ipt-server
            context: roles/ipt_server/files/ipt-server
          - image: powerdns
            context: roles/ipt_server/files/powerdns
          - image: wireguard
            context: roles/wireguard/files/wireguard
          - image: ospf-injector
            context: roles/backbone_network/files/ospf_injector
          - image: frr-sidecar
            context: roles/backbone_network/files/frr_sidecar
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/alexmkx/garuda-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
